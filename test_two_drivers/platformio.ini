; แฟลชจากโฟลเดอร์นี้:  pio run -t upload --upload-port COM4  (เทสเสร็จต้องแฟลช esp32_mecanum_base กลับ)

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<*> -<.pio/>
build_flags = -Wall -Wextra -Wno-unused-parameter
monitor_speed = 115200
; บอร์ดนี้ (CH9102) ถูกกดขา EN ค้างถ้า DTR+RTS ติดทั้งคู่ monitor ต้องปล่อยทั้งสองขา
monitor_dtr = 0
monitor_rts = 0
