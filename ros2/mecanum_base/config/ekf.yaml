# robot_localization EKF: รวม wheel_odom (ESP32) กับ rf2o (laser odometry)
# ส่ง TF odom -> base_link แทน rf2o  (rf2o ต้องตั้ง publish_tf: false ใน odometry.launch.py ไม่งั้น TF ชนกัน)
# ผล: /odometry/filtered  +  TF odom -> base_link   slam_toolbox ยังส่ง map -> odom ตามเดิม
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5          # rf2o ออก ~5.8 Hz ตามความถี่ lidar
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    # rf2o ใส่ stamp เป็นเวลาของ scan ที่ใช้ มาถึงช้ากว่าเวลาจริง ~200 ms ส่วน wheel_odom สด (~2 ms)
    # ไม่เปิดตัวนี้ EKF จะเอาค่า rf2o มาแก้ state ปัจจุบันเลยโดยไม่ย้อนเวลา
    smooth_lagged_data: true
    history_length: 1.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ------------------------------------------------------------------
    # ลำดับใน _config: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    # ------------------------------------------------------------------

    # wheel_odom: ใช้ความเร็ว vx vy vyaw (covariance มาจาก twist_covariance_diagonal ใน mecanum_base.yaml)
    # vyaw เปิดเพราะ yaw จาก lidar ผิดในที่ทดสอบ (2026-09-15 วิ่ง 1 m: rf2o -5.1° SLAM -4.5°
    # แต่วัดมุมหน้า/หลังของฐานกับเส้นข้างได้เท่ากัน = หุ่นไม่ได้หมุน) ตอนนี้ DM556 ตัวเดียวสั่งหมุนไม่ได้
    # wheel odom บอก yaw rate 0 จึงใกล้จริงกว่า  ข้อเสีย: หุ่นหมุนเพราะล้อลื่นหรือโดนผลักจะมองไม่เห็น
    # (slam_toolbox ยังแก้ในกรอบ map ให้)  ได้ไดรเวอร์ครบ/มี IMU แล้วค่อยทบทวนน้ำหนัก
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # rf2o (ผ่าน odom_covariance_relay เพื่อเติม covariance): ใช้ x y yaw แบบ differential
    # น้ำหนักตั้งให้หลวม (ดู odometry.launch.py) ล้อเป็นหลักทุกแกน rf2o ช่วยนิดหน่อย
    # rf2o ใส่ twist.linear.y เป็น 0 ตายตัว ใช้ twist กับหุ่น mecanum ไม่ได้ (มองไม่เห็นการเฉข้าง)
    # differential = เอาผลต่าง pose ระหว่างข้อความมาแปลงเป็นความเร็ว เลยได้ vx vy vyaw ครบ
    # และไม่ชนกับตำแหน่งสะสมของ EKF เอง
    odom1: /odom_rf2o_cov
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: true
    odom1_relative: false
    odom1_queue_size: 10
