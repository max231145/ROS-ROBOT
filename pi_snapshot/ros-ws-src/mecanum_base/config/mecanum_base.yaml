/**:
  ros__parameters:
    # ------------------------------------------------------------------
    # พอร์ต: ESP32 ตัวนี้เป็นชิป CH9102 ขึ้นบน Pi เป็น /dev/ttyACM0 (ไดรเวอร์ cdc_acm)
    # ส่วน YDLidar เป็น CP2102 ขึ้นเป็น ttyUSB0 -- ใช้ชื่อ by-id ที่มี serial ของบอร์ด
    # ชื่อนี้ไม่เปลี่ยนตามลำดับบูตหรือช่อง USB ที่เสียบ ไม่ต้องทำ udev rule
    # เปลี่ยนบอร์ด ESP32 ต้องแก้ serial ท้ายชื่อ ดูได้จาก  ls /dev/serial/by-id/
    # ------------------------------------------------------------------
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_58EA045139-if00
    baud: 115200               # ต้องตรงกับ SERIAL_BAUD ในไฟล์ .ino
    status_hz: 30              # ความถี่ที่บอร์ดส่งตัวนับ step กลับ = ความถี่ /wheel_odom
    cmd_rate: 30.0             # Hz ส่งความเร็วลงบอร์ด (เป็น heartbeat ด้วย ห้ามต่ำกว่า ~5 Hz)
    cmd_timeout: 0.5           # s  ไม่มี cmd_vel ใหม่เกินนี้ = สั่งหยุด
    use_stamped_cmd_vel: false # Nav2 Jazzy ส่ง Twist ธรรมดาเป็นค่าตั้งต้น
    auto_enable: false         # false = ต่อบอร์ดติดแล้วไดรเวอร์ยังปิด มอเตอร์ไม่มีไฟ ไม่ร้อนตอนไม่ใช้
                               #         ต้องเรียก service ~/enable ก่อนสั่งวิ่ง (ล้อไม่ล็อก จอดทางลาดจะไหล)
                               # true  = เปิดไดรเวอร์ทันทีที่ต่อบอร์ดติด ล้อล็อกตลอด

    # ------------------------------------------------------------------
    # ขนาดหุ่น
    #   wheel_radius : รัศมีล้อ = เส้นผ่านศูนย์กลาง / 2
    #   wheel_base   : ระยะระหว่างแกนล้อหน้ากับแกนล้อหลัง
    #   track_width  : ระยะระหว่างกึ่งกลางหน้าล้อซ้ายกับกึ่งกลางหน้าล้อขวา
    # wheel_base กับ track_width ใช้เฉพาะตอนหมุนตัว (wz) เดินหน้า/เดินข้างไม่ใช้
    # ------------------------------------------------------------------
    wheel_radius: 0.062        # m  2026-09-23 หลังสลับล้อหลัง: tools/line_test.py สั่ง 1 m ล้อนับ 100.3 cm
                               #    ตลับเมตรจริง 94 cm (lidar วัดได้ 92.6) -> 0.0661 x 94/100.3 = 0.0620
                               #    (เดิม 0.0661 จากเทส 15 ก.ย. ตอนมอเตอร์ 4 ตัวบนไดรเวอร์เดียว)
    wheel_base: 0.42           # m  วัดตลับเมตร 42 cm (2026-09-15)
    track_width: 0.58          # m  !! ค่าจูน ไม่ใช่ระยะจริง (จริงราว 0.49) -- ใช้แค่ k = (wheel_base + track_width)/2
                               #    2026-09-23 ดึก: ล้อจัดถูกแล้ว (ตัวอักษรเดียวกันอยู่มุมทแยง: L หน้าปลั๊ก+หลังแบต
                               #    R หน้าแบต+หลังปลั๊ก) + ย้ายแบตไว้กลางหุ่น -> lidar_offset_test 0.25 rad/s สั่ง 89.3°
                               #    จริง 62.6° จุดหมุนห่างกลาง 3 cm -> k_eff = 0.350 / (62.6/89.3) = 0.50
                               #    -> track_width = 2 x 0.50 - 0.42 = 0.58  (เรขาคณิต k 0.455 -- ไถลราว 10%)
                               #    ค่าเดิม 0.28 จูนตอนล้อฝั่งปลั๊กสลับหน้า-หลัง (หมุนเร็วเกิน + กวาดข้าง) ใช้ไม่ได้แล้ว

    steps_per_rev: 200         # มอเตอร์ 1.8 องศา
    microsteps: 8              # ต้องตรงกับ DIP SW ของ DM556 (1600 step/รอบ)
    gear_ratio: 1.0            # มอเตอร์หมุนกี่รอบต่อล้อ 1 รอบ

    # ล้อไหนหมุนกลับด้าน แก้ตรงนี้ ไม่ต้องแฟลชเฟิร์มแวร์ใหม่  ลำดับ: หน้าซ้าย หน้าขวา หลังซ้าย หลังขวา
    # ข้างขวาหมุนถอยเมื่อสั่งเดินหน้า (ยืนยันด้วยตา 2026-09-16 ตอนรัน polarity_sweep ชุด 1)
    # กลับทิศช่อง 1 (หน้าขวา) และ 3 (หลังขวา) -- แก้ที่นี่ได้ ไม่ต้องสลับสาย A+/A-
    # 2026-09-17 ผู้ใช้ยืนยันบนพื้นว่าชุดนี้วิ่งถูกทาง (ลองกลับทั้งชุดแล้ว rf2o ยังติดลบเหมือนเดิม
    # = rf2o ใช้ตัดสินทิศในที่นี้ไม่ได้ ไม่ใช่ปัญหาทิศล้อ)
    invert_wheels: [false, true, false, true]
    wheel_scale: [1.0, 0.983, 1.0, 0.983]   # FL FR RL RR  2026-10-11 ล้อขวาวิ่งได้น้อยกว่า ~1.7%

    # ------------------------------------------------------------------
    # เพดาน
    # ------------------------------------------------------------------
    # !! DM556 2 ตัว: ซ้าย = ช่อง 0 (หน้าซ้าย, GPIO 25/26) คุมมอเตอร์หน้าซ้าย+หลังซ้ายขนานกัน
    #    ขวา = ช่อง 1 (หน้าขวา, GPIO 27/14) คุมหน้าขวา+หลังขวา  ENA ร่วม GPIO 23
    #    แบบนี้เดินหน้า/ถอยหลัง/หมุนซ้าย/หมุนขวาได้ (vy=0 -> FL=RL และ FR=RR พอดี)
    #    แต่ **เดินข้างไม่ได้** สั่ง vy แล้วหุ่นจะหมุนตัวแทน จึงคง max_vy: 0.0
    #    ได้ไดรเวอร์ครบ 4 ตัวแล้วค่อยเปิด max_vy เป็น 0.3 !!
    max_vx: 0.5                # m/s
    max_vy: 0.0                # m/s
    max_wz: 1.0                # rad/s  เปิดแล้ว 2026-09-16 (ไดรเวอร์ 2 ตัว) นิ่งแล้วค่อยขึ้น 1.0
    max_wheel_rate: 3200       # step/s ต่อล้อ (2 รอบ/s) เกินแล้วย่อทุกล้อตามสัดส่วน
    wheel_accel: 2000          # step/s^2 มอเตอร์ 4 ตัวบนไดรเวอร์เดียวแรงบิดต่ำ เร่งแรงสเต็ปจะหลุด

    # ------------------------------------------------------------------
    # odometry
    # ------------------------------------------------------------------
    odom_frame: odom
    base_frame: base_link
    publish_tf: false          # rf2o ส่ง TF odom -> base_link อยู่แล้ว เปิดซ้อนแล้ว TF จะกระโดดไปมา
                               # เปิดได้เฉพาะตอนไม่มี rf2o/EKF ตัวอื่นส่ง TF นี้
    # ล้อ mecanum ไถลมาก ค่าความคลาดเคลื่อนตั้งไว้สูงกว่าล้อธรรมดา (vy แย่กว่า vx)
    # ลำดับ: x y z roll pitch yaw  ค่า 1.0e6 = ไม่ได้วัดแกนนั้น
    # EKF (config/ekf.yaml) ใช้ twist vx vy vyaw:
    #   vx 1e-3 (std ~0.03 m/s)  เทสบนพื้นคลาด ~1-2% หลังปรับขนาดล้อ
    #   vy 1e-2 หลวมกว่า: mecanum ไถลข้างง่าย และไดรเวอร์ตัวเดียวทำให้ wheel odom เห็น vy = 0 เสมอ
    #   vyaw 1e-3: yaw จาก lidar ผิดในที่ทดสอบ (-5° ต่อ 1 m ทั้งที่หุ่นไม่หมุน) ให้ล้อเป็นหลัก ~95%
    pose_covariance_diagonal: [0.01, 0.01, 1.0e6, 1.0e6, 1.0e6, 0.05]
    twist_covariance_diagonal: [1.0e-3, 1.0e-2, 1.0e6, 1.0e6, 1.0e6, 1.0e-3]
    # ตอนหมุนอยู่กับที่ (|vx| < spin_max_vx และ |wz| > spin_min_wz) ส่ง vyaw covariance ค่านี้แทน 1e-3
    # 2026-09-23: สั่งหมุน 90° ได้จริง 45°/63°/93°/116° แล้วแต่รอบ (วัดด้วย tools/lidar_offset_test.py)
    # แต่ rf2o นับได้ 92.3° จากจริง 92.7° -> ให้ EKF เชื่อ yaw จาก rf2o ช่วงนั้น (rf2o yaw ~3e-3 -> ~99.7%)
    # วิ่งตรง/เลี้ยวระหว่างวิ่ง ยังเชื่อล้อเหมือนเดิม เพราะตอนนั้นล้อนับแม่น
    spin_vyaw_covariance: 1.0
    # vx vy ช่วงเดียวกัน: หมุน 90° หุ่นกวาดจริง (-16,-36)/(-23,-20) cm rf2o วัดได้ (-15,-35)/(-22,-21) แต่ล้อบอก 0
    # !! ปิดไว้ (= ค่าปกติ): ลองตั้ง 1.0 แล้ว (23 ก.ย. 23:43) Nav2 หมุนกลับไม่สำเร็จ วนอยู่ 92 s หุ่นไปไกล 95 cm
    #    EKF หัน -91° ทั้งที่จริง +130° -- ตำแหน่งจาก rf2o ไหลเข้า EKF + SLAM เริ่มแก้กลางการหมุน แล้วพังทั้งชุด
    spin_linear_covariance: 1.0e-3
    spin_max_vx: 0.03          # m/s
    spin_min_wz: 0.05          # rad/s
